<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT OS // 40-Yubiley Ekotizimi</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --bg-panel: #111827;
            --accent: #00f0ff;
            --accent-secondary: #7000ff;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: rgba(0, 240, 255, 0.2);
            --success: #10b981;
            --warn: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(112, 0, 255, 0.12), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 240, 255, 0.12), transparent 25%);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 1.5px;
        }

        .logo span {
            color: var(--accent);
        }

        .sync-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            color: var(--success);
        }

        .sync-status.offline {
            background: rgba(245, 158, 11, 0.12);
            border-color: rgba(245, 158, 11, 0.35);
            color: var(--warn);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: currentColor;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
            70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 2rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.2rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 1.3rem;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 4px; height: 100%;
            background: linear-gradient(to bottom, var(--accent), var(--accent-secondary));
        }

        .stat-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 0.4rem;
            color: #fff;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .search-box {
            flex: 1;
            min-width: 260px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: white;
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .search-box:focus {
            border-color: var(--accent);
        }

        .filters {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.6rem 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .filter-btn:hover, .filter-btn.active {
            background: rgba(0, 240, 255, 0.15);
            border-color: var(--accent);
            color: var(--accent);
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 1.5rem;
        }

        .project-card {
            background: var(--bg-panel);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.25s, border-color 0.25s;
        }

        .project-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 10px 30px -10px rgba(0, 240, 255, 0.2);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .project-number {
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--accent);
            background: rgba(0, 240, 255, 0.1);
            padding: 3px 8px;
            border-radius: 5px;
        }

        .project-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            padding: 3px 10px;
            border-radius: 20px;
            background: rgba(112, 0, 255, 0.2);
            color: #c4b5fd;
            border: 1px solid rgba(112, 0, 255, 0.4);
        }

        .project-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.6rem;
        }

        .project-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 1.2rem;
        }

        .tech-stack {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 1.3rem;
        }

        .tech-tag {
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 3px 8px;
            border-radius: 4px;
            color: #d1d5db;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 1rem;
        }

        .btn {
            flex: 1;
            text-align: center;
            text-decoration: none;
            padding: 0.6rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-primary {
            background: var(--accent);
            color: #000;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ PROJECT <span>OS</span> // v4.0</div>
        <div class="sync-status" id="syncBadge">
            <div class="pulse-dot"></div>
            <span id="syncText">Firebase ulanmoqda...</span>
        </div>
    </header>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">Jami Loyihalar</div>
                <div class="stat-value" id="totalCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Faol Tizimlar</div>
                <div class="stat-value" id="activeCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Ekotizim Holati</div>
                <div class="stat-value" style="font-size: 1.3rem; color: var(--accent);">40-Yubiley Firebase</div>
            </div>
        </div>

        <div class="controls">
            <input type="text" id="searchInput" class="search-box" placeholder="Loyiha nomi yoki texnologiya bo‘yicha qidirish...">
            <div class="filters" id="filterContainer">
                <button class="filter-btn active" data-category="all">Barchasi</button>
                <button class="filter-btn" data-category="Web">Veb-ilovalar</button>
                <button class="filter-btn" data-category="AI">AI & Avtomatizatsiya</button>
                <button class="filter-btn" data-category="Game">O‘yin & 3D</button>
                <button class="filter-btn" data-category="Business">Biznes & Ta'lim</button>
            </div>
        </div>

        <div class="projects-grid" id="projectsGrid"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        // O'Z FIREBASE KONFIGURATSIYANGIZNI SHU YERGA QO'YING
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const STORAGE_KEY = 'ecosystem_projects_firebase_v1';
        const DB_PATH = 'projects_40_ecosystem';

        let projectsData = [];
        let currentCategory = 'all';

        const syncBadge = document.getElementById('syncBadge');
        const syncText = document.getElementById('syncText');

        function setSyncStatus(text, isOnline) {
            syncText.textContent = text;
            syncBadge.classList.toggle('offline', !isOnline);
        }

        function renderProjects() {
            const grid = document.getElementById('projectsGrid');
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();

            const filtered = projectsData.filter(p => {
                const matchesCategory = currentCategory === 'all' || p.category === currentCategory;
                const techList = Array.isArray(p.tech) ? p.tech : [];
                const matchesSearch =
                    (p.title || '').toLowerCase().includes(searchQuery) ||
                    (p.description || '').toLowerCase().includes(searchQuery) ||
                    techList.some(t => t.toLowerCase().includes(searchQuery));
                return matchesCategory && matchesSearch;
            });

            document.getElementById('totalCount').textContent = projectsData.length;
            document.getElementById('activeCount').textContent = projectsData.filter(p => p.status === 'active').length;

            if (!filtered.length) {
                grid.innerHTML = `<p style="color: var(--text-muted); grid-column: 1/-1;">Mos loyiha topilmadi.</p>`;
                return;
            }

            grid.innerHTML = filtered.map(project => `
                <div class="project-card">
                    <div>
                        <div class="card-header">
                            <span class="project-number">#${String(project.id).padStart(2, '0')}</span>
                            <span class="project-category">${project.category || 'Web'}</span>
                        </div>
                        <h3 class="project-title">${project.title}</h3>
                        <p class="project-desc">${project.description || ''}</p>
                        <div class="tech-stack">
                            ${(project.tech || []).map(t => `<span class="tech-tag">${t}</span>`).join('')}
                        </div>
                    </div>
                    <div class="card-actions">
                        <a href="${project.liveUrl || '#'}" target="_blank" class="btn btn-primary">Ishga tushirish ↗</a>
                        <a href="${project.codeUrl || '#'}" target="_blank" class="btn btn-secondary">Kod / Manba</a>
                    </div>
                </div>
            `).join('');
        }

        // Avval localStorage'dan darhol ko'rsatib, uzilmaslikni ta'minlaymiz
        const cached = localStorage.getItem(STORAGE_KEY);
        if (cached) {
            projectsData = JSON.parse(cached);
            renderProjects();
        }

        // Firebase ulanishini ishga tushirish
        try {
            const app = initializeApp(firebaseConfig);
            const db = getDatabase(app);
            const projectsRef = ref(db, DB_PATH);

            onValue(projectsRef, (snapshot) => {
                if (snapshot.exists()) {
                    const val = snapshot.val();
                    projectsData = Array.isArray(val) ? val.filter(Boolean) : Object.values(val);
                    projectsData.sort((a, b) => Number(b.id) - Number(a.id));
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(projectsData));
                } else {
                    projectsData = [];
                    localStorage.setItem(STORAGE_KEY, JSON.stringify([]));
                }
                setSyncStatus("Firebase Real-Time ulangan", true);
                renderProjects();
            }, (error) => {
                console.error(error);
                setSyncStatus("Offline / Kesh rejimi", false);
                renderProjects();
            });
        } catch (err) {
            console.warn("Firebase config hali to'ldirilmagan yoki xato:", err);
            setSyncStatus("Mahalliy kesh rejimi (Config kutilyapti)", false);
            renderProjects();
        }

        document.getElementById('filterContainer').addEventListener('click', (e) => {
            if (e.target.classList.contains('filter-btn')) {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentCategory = e.target.dataset.category;
                renderProjects();
            }
        });

        document.getElementById('searchInput').addEventListener('input', renderProjects);
    </script>
</body>
</html>
